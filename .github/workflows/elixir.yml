name: CI
on:
  push:
    tags:
      - "v*"
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_call:
jobs:
  ash-ci:
    # The org default token is read-only; ash-ci jobs request these.
    permissions:
      contents: write
      pages: write
      id-token: write
      security-events: write
    uses: ash-project/ash/.github/workflows/ash-ci.yml@main
    with:
      reuse: true
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
